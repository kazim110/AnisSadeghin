plugins { id 'com.android.application' }
android {
    namespace 'ir.anis.reader'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.anis.reader'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.2.0-preview'
        testInstrumentationRunner 'ir.anis.reader.ReaderChecks'
    }
    buildTypes { debug { if (project.hasProperty('verificationBuild')) applicationIdSuffix '.verification' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
